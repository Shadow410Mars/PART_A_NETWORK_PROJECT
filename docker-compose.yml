services:
  # =========================================================================
  # IMAGE REPRODUCIBILITY NOTICE (Audit 3)
  # Tag phiên bản (apache/iotdb:2.0.11-standalone) là mặc định, dễ bảo trì,
  # auto nhận patch fix bảo mật khi người dùng chạy `docker compose pull`.
  #
  # NẾU CẦN TÁI LẬP CHUẨN XÁC 100% (cho báo cáo khoa học, cùng image layer
  # trên mọi host): thay `image: apache/iotdb:2.0.11-standalone` BẰNG dòng:
  #   image: apache/iotdb@sha256:5ace0f3eceff892dd349d02288224c966f3fdeb11d08c4f575b642a110b82338
  # Digest này được verify bằng `docker image inspect apache/iotdb:2.0.11-standalone`.
  # =========================================================================
  iotdb:
    image: apache/iotdb:2.0.11-standalone
    hostname: iotdb
    container_name: iotdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6667:6667"
      - "127.0.0.1:9091:9091"
      - "127.0.0.1:9092:9092"
    environment:
      TZ: Asia/Ho_Chi_Minh
      cn_internal_address: iotdb
      cn_internal_port: 10710
      cn_consensus_port: 10720
      cn_seed_config_node: iotdb:10710
      dn_rpc_address: iotdb
      dn_internal_address: iotdb
      dn_rpc_port: 6667
      dn_internal_port: 10730
      dn_mpp_data_exchange_port: 10740
      dn_schema_region_consensus_port: 10750
      dn_data_region_consensus_port: 10760
      dn_seed_config_node: iotdb:10710
    volumes:
      - ./iotdb/conf:/iotdb/conf:ro
      - iotdb-data:/iotdb/data
      - iotdb-logs:/iotdb/logs
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    networks:
      - iotdb-net

  # Digest (Audit 3): prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
  prometheus:
    image: prom/prometheus:v2.54.1
    hostname: prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - iotdb-net

  # Digest (Audit 3): grafana/grafana-oss@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
  grafana:
    image: grafana/grafana-oss:11.2.0
    hostname: grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - iotdb-net
    depends_on:
      - prometheus

networks:
  iotdb-net:
    name: iotdb-net
    driver: bridge

volumes:
  iotdb-data:
    name: iotdb-data
  iotdb-logs:
    name: iotdb-logs
  prometheus-data:
    name: prometheus-data
  grafana-data:
    name: grafana-data
